<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" width="100%" role="img" aria-labelledby="otif-measure-boundary-title otif-measure-boundary-desc" class="pi-f"><title id="otif-measure-boundary-title">Where the OTIF measure stops</title><desc id="otif-measure-boundary-desc">An order event sequence from customer requirement to confirmed delivery. The internal OTIF score measures only from the latest promise to despatch. Two promise changes and the gap between despatch and confirmed delivery sit outside the score, so a stable score can hide repeated manual intervention. Illustrative sequence with no client data.</desc><style>
.pi-f{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pi-t{fill:var(--text,#102f3d)}.pi-m{fill:var(--muted,#53626a)}.pi-a{fill:var(--brass,#b97a2a)}
.pi-inv{fill:var(--bg,#f7f5f0)}
.pi-sur{fill:var(--surface,#ffffff)}.pi-rz{fill:var(--raised,#edebe4)}.pi-ab{fill:var(--brass-bg,#f5e6cb)}
.pi-st{stroke:var(--text,#102f3d)}.pi-sm{stroke:var(--muted,#53626a)}.pi-sa{stroke:var(--brass,#b97a2a)}.pi-sb{stroke:var(--border,#d8d3c8)}
.pi-n{fill:none}.pi-h{font-weight:600}
</style><line x1="150" y1="60" x2="150" y2="480" stroke-width="3" stroke-dasharray="7 6" class="pi-sa"/><line x1="150" y1="300" x2="150" y2="380" stroke-width="9" stroke-linecap="round" class="pi-st"/><text x="128" y="425" font-size="17" class="pi-m" text-anchor="end">Not</text><text x="128" y="446" font-size="17" class="pi-m" text-anchor="end">measured</text><circle cx="150" cy="60" r="11" stroke-width="3" class="pi-sur pi-st"/><text x="185" y="58" font-size="20" class="pi-t pi-h" text-anchor="start">Requirement</text><text x="185" y="82" font-size="17" class="pi-m" text-anchor="start">Date the customer actually needs</text><circle cx="150" cy="140" r="11" stroke-width="3" class="pi-sur pi-st"/><text x="185" y="138" font-size="20" class="pi-t pi-h" text-anchor="start">Commitment</text><text x="185" y="162" font-size="17" class="pi-m" text-anchor="start">First promise made to the customer</text><circle cx="150" cy="220" r="11" class="pi-a"/><text x="185" y="218" font-size="20" class="pi-t pi-h" text-anchor="start">Promise changed</text><text x="185" y="242" font-size="17" class="pi-m" text-anchor="start">Manual intervention, not scored</text><circle cx="150" cy="300" r="11" class="pi-a"/><text x="185" y="298" font-size="20" class="pi-t pi-h" text-anchor="start">Promise changed again</text><text x="185" y="322" font-size="17" class="pi-m" text-anchor="start">The score now uses the latest date</text><circle cx="150" cy="380" r="11" stroke-width="3" class="pi-sur pi-st"/><text x="185" y="378" font-size="20" class="pi-t pi-h" text-anchor="start">Despatch</text><text x="185" y="402" font-size="17" class="pi-m" text-anchor="start">The internal measure stops here</text><circle cx="150" cy="480" r="11" stroke-width="3" class="pi-sur pi-st"/><text x="185" y="478" font-size="20" class="pi-t pi-h" text-anchor="start">Delivery confirmed</text><text x="185" y="502" font-size="17" class="pi-m" text-anchor="start">The customer judges success here</text><line x1="40" y1="545" x2="80" y2="545" stroke-width="9" stroke-linecap="round" class="pi-st"/><text x="96" y="551" font-size="17" class="pi-t" text-anchor="start">What the internal OTIF score measures</text><line x1="40" y1="577" x2="80" y2="577" stroke-width="3" stroke-dasharray="7 6" class="pi-sa"/><text x="96" y="583" font-size="17" class="pi-t" text-anchor="start">What the customer experiences</text><circle cx="60" cy="609" r="8" class="pi-a"/><text x="96" y="615" font-size="17" class="pi-t" text-anchor="start">Promise change or manual step, invisible in the score</text><text x="40" y="655" font-size="15" class="pi-m" text-anchor="start">Illustrative. No client or company data.</text></svg>