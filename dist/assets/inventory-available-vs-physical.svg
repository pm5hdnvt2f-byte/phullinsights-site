<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 816" width="100%" role="img" aria-labelledby="inventory-available-vs-physical-title inventory-available-vs-physical-desc" class="pi-f"><title id="inventory-available-vs-physical-title">Physical stock is not the same as available stock</title><desc id="inventory-available-vs-physical-desc">A stacked bar splits physical stock into available to promise, held for quality release, allocated to other orders, buffer for unreliable lead time or data, and slow moving or obsolete stock. Only the first segment protects service. Two bars then compare cutting the same total: a blanket reduction target removes available stock and increases expediting, while a segmented policy removes unavailable stock first so service holds. Illustrative proportions with no client data.</desc><style>
.pi-f{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pi-t{fill:var(--text,#102f3d)}.pi-m{fill:var(--muted,#53626a)}.pi-a{fill:var(--brass,#b97a2a)}
.pi-inv{fill:var(--bg,#f7f5f0)}
.pi-sur{fill:var(--surface,#ffffff)}.pi-rz{fill:var(--raised,#edebe4)}.pi-ab{fill:var(--brass-bg,#f5e6cb)}
.pi-st{stroke:var(--text,#102f3d)}.pi-sm{stroke:var(--muted,#53626a)}.pi-sa{stroke:var(--brass,#b97a2a)}.pi-sb{stroke:var(--border,#d8d3c8)}
.pi-n{fill:none}.pi-h{font-weight:600}
</style><text x="40" y="40" font-size="19" class="pi-t pi-h" text-anchor="start">Physical stock</text><rect x="40" y="60" width="90" height="150" class="pi-t"/><line x1="136" y1="135.0" x2="152" y2="135.0" stroke-width="1.5" class="pi-sm"/><text x="160" y="132.0" font-size="18" class="pi-t pi-h" text-anchor="start">Available to promise</text><text x="160" y="153.0" font-size="16" class="pi-m" text-anchor="start">The only stock that protects service</text><rect x="40" y="210" width="90" height="50" stroke-width="2" class="pi-ab pi-sa"/><line x1="136" y1="235.0" x2="152" y2="235.0" stroke-width="1.5" class="pi-sm"/><text x="160" y="232.0" font-size="18" class="pi-t pi-h" text-anchor="start">Held for quality release</text><text x="160" y="253.0" font-size="16" class="pi-m" text-anchor="start">Present, but not yet usable</text><rect x="40" y="260" width="90" height="60" stroke-width="2" class="pi-ab pi-sa"/><line x1="136" y1="290.0" x2="152" y2="290.0" stroke-width="1.5" class="pi-sm"/><text x="160" y="287.0" font-size="18" class="pi-t pi-h" text-anchor="start">Allocated to other orders</text><text x="160" y="308.0" font-size="16" class="pi-m" text-anchor="start">Committed elsewhere</text><rect x="40" y="320" width="90" height="70" stroke-width="2" class="pi-ab pi-sa"/><line x1="136" y1="355.0" x2="152" y2="355.0" stroke-width="1.5" class="pi-sm"/><text x="160" y="352.0" font-size="18" class="pi-t pi-h" text-anchor="start">Buffer for unreliable lead time or data</text><text x="160" y="373.0" font-size="16" class="pi-m" text-anchor="start">Compensates for a problem upstream</text><rect x="40" y="390" width="90" height="60" stroke-width="2" class="pi-ab pi-sa"/><line x1="136" y1="420.0" x2="152" y2="420.0" stroke-width="1.5" class="pi-sm"/><text x="160" y="417.0" font-size="18" class="pi-t pi-h" text-anchor="start">Slow moving or obsolete</text><text x="160" y="438.0" font-size="16" class="pi-m" text-anchor="start">Unlikely to meet future demand</text><path d="M32 212 H22 V448 H32" stroke-width="2" class="pi-n pi-sa"/><text x="40" y="510" font-size="19" class="pi-t pi-h" text-anchor="start">Two ways to cut the same amount of stock</text><text x="40" y="544" font-size="17" class="pi-t pi-h" text-anchor="start">Blanket reduction target</text><rect x="40" y="554" width="168" height="34" class="pi-t"/><rect x="208" y="554" width="56" height="34" stroke-width="2" stroke-dasharray="5 4" class="pi-n pi-st"/><rect x="264" y="554" width="252" height="34" stroke-width="2" class="pi-ab pi-sa"/><rect x="516" y="554" width="84" height="34" stroke-width="2" stroke-dasharray="5 4" class="pi-n pi-sa"/><text x="40" y="612" font-size="16" class="pi-m" text-anchor="start">Removes available stock too, so expediting rises</text><text x="40" y="650" font-size="17" class="pi-t pi-h" text-anchor="start">Segmented policy</text><rect x="40" y="660" width="224" height="34" class="pi-t"/><rect x="264" y="660" width="196" height="34" stroke-width="2" class="pi-ab pi-sa"/><rect x="460" y="660" width="140" height="34" stroke-width="2" stroke-dasharray="5 4" class="pi-n pi-sa"/><text x="40" y="718" font-size="16" class="pi-m" text-anchor="start">Removes unavailable stock first, so service holds</text><rect x="40" y="748" width="16" height="16" class="pi-t"/><text x="64" y="762" font-size="16" class="pi-t" text-anchor="start">Available</text><rect x="160" y="748" width="16" height="16" stroke-width="2" class="pi-ab pi-sa"/><text x="184" y="762" font-size="16" class="pi-t" text-anchor="start">Present, not available</text><rect x="380" y="748" width="16" height="16" stroke-width="2" stroke-dasharray="4 3" class="pi-n pi-sm"/><text x="404" y="762" font-size="16" class="pi-t" text-anchor="start">Removed</text><text x="40" y="798" font-size="15" class="pi-m" text-anchor="start">Illustrative. No client or company data. Proportions are for illustration.</text></svg>