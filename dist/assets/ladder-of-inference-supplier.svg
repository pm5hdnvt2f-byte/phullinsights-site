<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 886" width="100%" role="img" aria-labelledby="ladder-of-inference-supplier-title ladder-of-inference-supplier-desc" class="pi-f"><title id="ladder-of-inference-supplier-title">The Ladder of Inference in a supplier dispute</title><desc id="ladder-of-inference-supplier-desc">A seven-rung ladder climbing from observable data to selected data, added meaning, assumptions, conclusions, beliefs and actions, each with a supplier example: a consignment arrives after the agreed date and ends with escalation and switching supply. A loop shows beliefs shaping which data is noticed next. Three markers show where to intervene: describe the event without adjectives, find the first assumption that changed its meaning, and ask a question that could disconfirm the conclusion. Model after Chris Argyris. Illustrative example.</desc><style>
.pi-f{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pi-t{fill:var(--text,#102f3d)}.pi-m{fill:var(--muted,#53626a)}.pi-a{fill:var(--brass,#b97a2a)}
.pi-inv{fill:var(--bg,#f7f5f0)}
.pi-sur{fill:var(--surface,#ffffff)}.pi-rz{fill:var(--raised,#edebe4)}.pi-ab{fill:var(--brass-bg,#f5e6cb)}
.pi-st{stroke:var(--text,#102f3d)}.pi-sm{stroke:var(--muted,#53626a)}.pi-sa{stroke:var(--brass,#b97a2a)}.pi-sb{stroke:var(--border,#d8d3c8)}
.pi-n{fill:none}.pi-h{font-weight:600}
</style><line x1="80" y1="90" x2="80" y2="630" stroke-width="4" class="pi-st"/><line x1="160" y1="90" x2="160" y2="630" stroke-width="4" class="pi-st"/><line x1="80" y1="600" x2="160" y2="600" stroke-width="4" class="pi-st"/><text x="190" y="598" font-size="19" class="pi-t pi-h" text-anchor="start">Observable data</text><text x="190" y="621" font-size="16" class="pi-m" text-anchor="start">The consignment arrived after the agreed date</text><line x1="80" y1="520" x2="160" y2="520" stroke-width="4" class="pi-st"/><text x="190" y="518" font-size="19" class="pi-t pi-h" text-anchor="start">Selected data</text><text x="190" y="541" font-size="16" class="pi-m" text-anchor="start">We notice the late arrival, not the changed order</text><line x1="80" y1="440" x2="160" y2="440" stroke-width="4" class="pi-st"/><text x="190" y="438" font-size="19" class="pi-t pi-h" text-anchor="start">Added meaning</text><text x="190" y="461" font-size="16" class="pi-m" text-anchor="start">They did not treat us as a priority</text><line x1="80" y1="360" x2="160" y2="360" stroke-width="4" class="pi-st"/><text x="190" y="358" font-size="19" class="pi-t pi-h" text-anchor="start">Assumptions</text><text x="190" y="381" font-size="16" class="pi-m" text-anchor="start">They favour a larger customer</text><line x1="80" y1="280" x2="160" y2="280" stroke-width="4" class="pi-st"/><text x="190" y="278" font-size="19" class="pi-t pi-h" text-anchor="start">Conclusions</text><text x="190" y="301" font-size="16" class="pi-m" text-anchor="start">This supplier cannot be relied upon</text><line x1="80" y1="200" x2="160" y2="200" stroke-width="4" class="pi-st"/><text x="190" y="198" font-size="19" class="pi-t pi-h" text-anchor="start">Beliefs</text><text x="190" y="221" font-size="16" class="pi-m" text-anchor="start">Suppliers only respond to pressure</text><line x1="80" y1="120" x2="160" y2="120" stroke-width="4" class="pi-st"/><text x="190" y="118" font-size="19" class="pi-t pi-h" text-anchor="start">Actions</text><text x="190" y="141" font-size="16" class="pi-m" text-anchor="start">Escalate and start switching supply</text><path d="M72 200 C 18 200, 18 520, 66 520" stroke-width="3" class="pi-n pi-sa"/><path d="M56 512 L70 520 L56 528" stroke-width="3" stroke-linejoin="round" class="pi-n pi-sa"/><circle cx="120.0" cy="600" r="15" class="pi-a"/><text x="120.0" y="606" font-size="17" class="pi-inv pi-h" text-anchor="middle">1</text><circle cx="120.0" cy="440" r="15" class="pi-a"/><text x="120.0" y="446" font-size="17" class="pi-inv pi-h" text-anchor="middle">2</text><circle cx="120.0" cy="280" r="15" class="pi-a"/><text x="120.0" y="286" font-size="17" class="pi-inv pi-h" text-anchor="middle">3</text><text x="40" y="680" font-size="19" class="pi-t pi-h" text-anchor="start">Where to intervene</text><circle cx="55" cy="708" r="13" class="pi-a"/><text x="55" y="714" font-size="15" class="pi-inv pi-h" text-anchor="middle">1</text><text x="80" y="714" font-size="17" class="pi-t" text-anchor="start">Describe the event without adjectives or motives</text><circle cx="55" cy="742" r="13" class="pi-a"/><text x="55" y="748" font-size="15" class="pi-inv pi-h" text-anchor="middle">2</text><text x="80" y="748" font-size="17" class="pi-t" text-anchor="start">Find the first assumption that changed its meaning</text><circle cx="55" cy="776" r="13" class="pi-a"/><text x="55" y="782" font-size="15" class="pi-inv pi-h" text-anchor="middle">3</text><text x="80" y="782" font-size="17" class="pi-t" text-anchor="start">Ask a question that could disconfirm your conclusion</text><path d="M40 808 C 60 792, 80 792, 96 808" stroke-width="3" class="pi-n pi-sa"/><text x="110" y="814" font-size="17" class="pi-t" text-anchor="start">Beliefs shape which data we notice next</text><text x="40" y="852" font-size="15" class="pi-m" text-anchor="start">Model after Chris Argyris, popularised by Peter Senge.</text><text x="40" y="872" font-size="15" class="pi-m" text-anchor="start">Supplier example is illustrative.</text></svg>