<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="100%" role="img" aria-labelledby="iso-14001-certified-scope-title iso-14001-certified-scope-desc" class="pi-f"><title id="iso-14001-certified-scope-title">A certificate covers its stated scope, not every activity</title><desc id="iso-14001-certified-scope-desc">Nine tiles represent activities an organisation manages: central warehouse, head office, branch network, own fleet, contracted transport, returns and repairs, packaging, key suppliers and waste contractors. A dashed certified scope boundary encloses only the central warehouse, head office and own fleet, leaving the other six activities managed but outside the certificate. Illustrative, with no coverage percentage implied.</desc><style>
.pi-f{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pi-t{fill:var(--text,#102f3d)}.pi-m{fill:var(--muted,#53626a)}.pi-a{fill:var(--brass,#b97a2a)}
.pi-inv{fill:var(--bg,#f7f5f0)}
.pi-sur{fill:var(--surface,#ffffff)}.pi-rz{fill:var(--raised,#edebe4)}.pi-ab{fill:var(--brass-bg,#f5e6cb)}
.pi-st{stroke:var(--text,#102f3d)}.pi-sm{stroke:var(--muted,#53626a)}.pi-sa{stroke:var(--brass,#b97a2a)}.pi-sb{stroke:var(--border,#d8d3c8)}
.pi-n{fill:none}.pi-h{font-weight:600}
</style><rect x="30" y="30" width="580" height="390" rx="14" stroke-width="2" class="pi-sur pi-sb"/><text x="50" y="66" font-size="19" class="pi-t pi-h" text-anchor="start">Activities you manage</text><path d="M40 85 H415 V193 H228 V300 H40 Z" stroke-width="3" stroke-dasharray="9 6" stroke-linejoin="round" class="pi-n pi-sa"/><rect x="50" y="95" width="170" height="90" rx="8" stroke-width="1.5" class="pi-ab pi-sa"/><text x="66" y="135.0" font-size="18" class="pi-t" text-anchor="start">Central</text><text x="66" y="157.0" font-size="18" class="pi-t" text-anchor="start">warehouse</text><rect x="235" y="95" width="170" height="90" rx="8" stroke-width="1.5" class="pi-ab pi-sa"/><text x="251" y="146.0" font-size="18" class="pi-t" text-anchor="start">Head office</text><rect x="420" y="95" width="170" height="90" rx="8" stroke-width="1.5" class="pi-rz pi-sb"/><text x="436" y="146.0" font-size="18" class="pi-t" text-anchor="start">Branch network</text><rect x="50" y="200" width="170" height="90" rx="8" stroke-width="1.5" class="pi-ab pi-sa"/><text x="66" y="251.0" font-size="18" class="pi-t" text-anchor="start">Own fleet</text><rect x="235" y="200" width="170" height="90" rx="8" stroke-width="1.5" class="pi-rz pi-sb"/><text x="251" y="240.0" font-size="18" class="pi-t" text-anchor="start">Contracted</text><text x="251" y="262.0" font-size="18" class="pi-t" text-anchor="start">transport</text><rect x="420" y="200" width="170" height="90" rx="8" stroke-width="1.5" class="pi-rz pi-sb"/><text x="436" y="240.0" font-size="18" class="pi-t" text-anchor="start">Returns and</text><text x="436" y="262.0" font-size="18" class="pi-t" text-anchor="start">repairs</text><rect x="50" y="305" width="170" height="90" rx="8" stroke-width="1.5" class="pi-rz pi-sb"/><text x="66" y="356.0" font-size="18" class="pi-t" text-anchor="start">Packaging</text><rect x="235" y="305" width="170" height="90" rx="8" stroke-width="1.5" class="pi-rz pi-sb"/><text x="251" y="356.0" font-size="18" class="pi-t" text-anchor="start">Key suppliers</text><rect x="420" y="305" width="170" height="90" rx="8" stroke-width="1.5" class="pi-rz pi-sb"/><text x="436" y="345.0" font-size="18" class="pi-t" text-anchor="start">Waste</text><text x="436" y="367.0" font-size="18" class="pi-t" text-anchor="start">contractors</text><rect x="30" y="444" width="30" height="18" rx="3" stroke-width="3" stroke-dasharray="6 4" class="pi-ab pi-sa"/><text x="72" y="459" font-size="17" class="pi-t" text-anchor="start">Inside the certified scope</text><rect x="330" y="444" width="30" height="18" rx="3" stroke-width="1.5" class="pi-rz pi-sb"/><text x="372" y="459" font-size="17" class="pi-t" text-anchor="start">Managed, but outside it</text><text x="30" y="498" font-size="17" class="pi-t" text-anchor="start">The certificate describes its stated scope, not every activity.</text><text x="30" y="532" font-size="15" class="pi-m" text-anchor="start">Tiles are illustrative. No coverage percentage is implied.</text></svg>