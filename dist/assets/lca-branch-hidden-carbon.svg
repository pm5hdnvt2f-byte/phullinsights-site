<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 572" width="100%" role="img" aria-labelledby="lca-branch-hidden-carbon-title lca-branch-hidden-carbon-desc" class="pi-f"><title id="lca-branch-hidden-carbon-title">The energy bill shows one stage of a building&#x27;s life cycle</title><desc id="lca-branch-hidden-carbon-desc">Five life cycle stages of a branch building sit inside an assessment boundary: materials, construction, refurbishment, operation and end of life. Only operation is measured through meter readings and appears on the energy bill, with a narrow uncertainty range. The other four stages are estimated from incomplete building data and carry wider ranges. Heights and ranges are illustrative, with no company data.</desc><style>
.pi-f{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pi-t{fill:var(--text,#102f3d)}.pi-m{fill:var(--muted,#53626a)}.pi-a{fill:var(--brass,#b97a2a)}
.pi-inv{fill:var(--bg,#f7f5f0)}
.pi-sur{fill:var(--surface,#ffffff)}.pi-rz{fill:var(--raised,#edebe4)}.pi-ab{fill:var(--brass-bg,#f5e6cb)}
.pi-st{stroke:var(--text,#102f3d)}.pi-sm{stroke:var(--muted,#53626a)}.pi-sa{stroke:var(--brass,#b97a2a)}.pi-sb{stroke:var(--border,#d8d3c8)}
.pi-n{fill:none}.pi-h{font-weight:600}
</style><path d="M40 96 V84 H600 V96" stroke-width="3" stroke-dasharray="8 6" class="pi-n pi-sa"/><text x="320" y="70" font-size="17" class="pi-t" text-anchor="middle">Assessment boundary for the property decision</text><rect x="61" y="220" width="70" height="180" stroke-width="2" stroke-dasharray="6 4" class="pi-ab pi-sa"/><line x1="96" y1="160" x2="96" y2="280" stroke-width="2.5" class="pi-sm"/><line x1="86" y1="160" x2="106" y2="160" stroke-width="2.5" class="pi-sm"/><line x1="86" y1="280" x2="106" y2="280" stroke-width="2.5" class="pi-sm"/><text x="96" y="428" font-size="16" class="pi-t" text-anchor="middle">Materials</text><rect x="173" y="280" width="70" height="120" stroke-width="2" stroke-dasharray="6 4" class="pi-ab pi-sa"/><line x1="208" y1="240" x2="208" y2="320" stroke-width="2.5" class="pi-sm"/><line x1="198" y1="240" x2="218" y2="240" stroke-width="2.5" class="pi-sm"/><line x1="198" y1="320" x2="218" y2="320" stroke-width="2.5" class="pi-sm"/><text x="208" y="428" font-size="16" class="pi-t" text-anchor="middle">Construction</text><rect x="285" y="300" width="70" height="100" stroke-width="2" stroke-dasharray="6 4" class="pi-ab pi-sa"/><line x1="320" y1="260" x2="320" y2="340" stroke-width="2.5" class="pi-sm"/><line x1="310" y1="260" x2="330" y2="260" stroke-width="2.5" class="pi-sm"/><line x1="310" y1="340" x2="330" y2="340" stroke-width="2.5" class="pi-sm"/><text x="320" y="428" font-size="16" class="pi-t" text-anchor="middle">Refurbishment</text><rect x="397" y="270" width="70" height="130" class="pi-t"/><line x1="432" y1="260" x2="432" y2="280" stroke-width="2.5" class="pi-sm"/><line x1="422" y1="260" x2="442" y2="260" stroke-width="2.5" class="pi-sm"/><line x1="422" y1="280" x2="442" y2="280" stroke-width="2.5" class="pi-sm"/><text x="432" y="428" font-size="16" class="pi-t" text-anchor="middle">Operation</text><rect x="509" y="350" width="70" height="50" stroke-width="2" stroke-dasharray="6 4" class="pi-ab pi-sa"/><line x1="544" y1="320" x2="544" y2="380" stroke-width="2.5" class="pi-sm"/><line x1="534" y1="320" x2="554" y2="320" stroke-width="2.5" class="pi-sm"/><line x1="534" y1="380" x2="554" y2="380" stroke-width="2.5" class="pi-sm"/><text x="544" y="428" font-size="16" class="pi-t" text-anchor="middle">End of life</text><path d="M394 246 V236 H470 V246" stroke-width="3" class="pi-n pi-st"/><text x="432" y="226" font-size="17" class="pi-t pi-h" text-anchor="middle">Energy bill</text><line x1="40" y1="400" x2="600" y2="400" stroke-width="2" class="pi-sm"/><rect x="40" y="458" width="18" height="18" class="pi-t"/><text x="68" y="473" font-size="16" class="pi-t" text-anchor="start">Measured: meter readings</text><rect x="300" y="458" width="18" height="18" stroke-width="2" stroke-dasharray="4 3" class="pi-ab pi-sa"/><text x="328" y="473" font-size="16" class="pi-t" text-anchor="start">Estimated: incomplete building data</text><line x1="49" y1="494" x2="49" y2="516" stroke-width="2.5" class="pi-sm"/><line x1="41" y1="494" x2="57" y2="494" stroke-width="2.5" class="pi-sm"/><line x1="41" y1="516" x2="57" y2="516" stroke-width="2.5" class="pi-sm"/><text x="68" y="511" font-size="16" class="pi-t" text-anchor="start">Range of uncertainty</text><text x="40" y="554" font-size="15" class="pi-m" text-anchor="start">Heights and ranges show the idea only. No company data.</text></svg>