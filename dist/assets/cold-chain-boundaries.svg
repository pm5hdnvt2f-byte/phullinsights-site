<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 566" width="100%" role="img" aria-labelledby="cold-chain-boundaries-title cold-chain-boundaries-desc" class="pi-f"><title id="cold-chain-boundaries-title">A green SLA can still produce quarantined stock</title><desc id="cold-chain-boundaries-desc">A temperature trace across a cold-chain journey from pack-out, collection, hub dwell, delivery and release decision. During hub dwell the temperature leaves the narrower product range while staying inside the wider contract range, so the contracted SLA reports green. The contracted SLA covers collection to delivery only, while the product journey runs from pack-out to the release decision. Illustrative, with no client data.</desc><style>
.pi-f{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pi-t{fill:var(--text,#102f3d)}.pi-m{fill:var(--muted,#53626a)}.pi-a{fill:var(--brass,#b97a2a)}
.pi-inv{fill:var(--bg,#f7f5f0)}
.pi-sur{fill:var(--surface,#ffffff)}.pi-rz{fill:var(--raised,#edebe4)}.pi-ab{fill:var(--brass-bg,#f5e6cb)}
.pi-st{stroke:var(--text,#102f3d)}.pi-sm{stroke:var(--muted,#53626a)}.pi-sa{stroke:var(--brass,#b97a2a)}.pi-sb{stroke:var(--border,#d8d3c8)}
.pi-n{fill:none}.pi-h{font-weight:600}
</style><rect x="40" y="90" width="560" height="150" class="pi-rz"/><rect x="40" y="125" width="560" height="80" class="pi-ab"/><text x="50" y="112" font-size="16" class="pi-m" text-anchor="start">Contract range</text><text x="50" y="147" font-size="16" class="pi-t" text-anchor="start">Product range</text><line x1="80" y1="90" x2="80" y2="300" stroke-width="1.5" stroke-dasharray="3 5" class="pi-sm"/><line x1="180" y1="90" x2="180" y2="300" stroke-width="1.5" stroke-dasharray="3 5" class="pi-sm"/><line x1="300" y1="90" x2="300" y2="300" stroke-width="1.5" stroke-dasharray="3 5" class="pi-sm"/><line x1="430" y1="90" x2="430" y2="300" stroke-width="1.5" stroke-dasharray="3 5" class="pi-sm"/><line x1="560" y1="90" x2="560" y2="300" stroke-width="1.5" stroke-dasharray="3 5" class="pi-sm"/><polyline points="40,168 90,162 140,172 180,166 230,170 255,185 275,208 300,222 325,214 345,196 370,176 430,168 500,165 560,170 600,166" stroke-width="3" class="pi-n pi-st"/><polyline points="262,205 275,208 300,222 325,214 335,205" stroke-width="7" stroke-linecap="round" class="pi-n pi-sa"/><circle cx="300" cy="222" r="6" class="pi-a"/><text x="40" y="50" font-size="19" class="pi-t pi-h" text-anchor="start">Hub dwell: within contract, outside the product range</text><line x1="80" y1="300" x2="560" y2="300" stroke-width="2" class="pi-sm"/><circle cx="80" cy="300" r="9" stroke-width="3" class="pi-sur pi-st"/><text x="80" y="334" font-size="17" class="pi-t" text-anchor="middle">Pack-out</text><circle cx="180" cy="300" r="9" stroke-width="3" class="pi-sur pi-st"/><text x="180" y="334" font-size="17" class="pi-t" text-anchor="middle">Collection</text><circle cx="300" cy="300" r="9" stroke-width="3" class="pi-sur pi-st"/><text x="300" y="334" font-size="17" class="pi-t" text-anchor="middle">Hub dwell</text><circle cx="430" cy="300" r="9" stroke-width="3" class="pi-sur pi-st"/><text x="430" y="334" font-size="17" class="pi-t" text-anchor="middle">Delivery</text><circle cx="560" cy="300" r="9" stroke-width="3" class="pi-sur pi-st"/><text x="560" y="334" font-size="17" class="pi-t" text-anchor="middle">Release</text><text x="560" y="355" font-size="17" class="pi-t" text-anchor="middle">decision</text><path d="M180 400 V412 H430 V400" stroke-width="3" class="pi-n pi-st"/><text x="305" y="438" font-size="17" class="pi-t" text-anchor="middle">Contracted SLA: collection to delivery</text><path d="M80 468 V480 H560 V468" stroke-width="3" stroke-dasharray="7 6" class="pi-n pi-sa"/><text x="320" y="506" font-size="17" class="pi-t" text-anchor="middle">Product journey: pack-out to release decision</text><text x="40" y="548" font-size="15" class="pi-m" text-anchor="start">Illustrative. No client or company data.</text></svg>